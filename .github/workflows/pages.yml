name: deploy-config-tool
# Publishes config-tool-web/ (the PowerMic edition web configurator) to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches:
      - main
      - master
      - powermic
    paths:
      - 'config-tool-web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r config-tool-web/* _site/
          # Point the footer link at this repository.
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#g" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
